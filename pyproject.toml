[project]
name = "shape6d"
version = "0.1.0"
description = "Shape6D: zero-shot, shape-primary 6D pose estimation for industrial objects (sparse LiDAR + RGB)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
render = ["pyrender>=0.1.45"]

[project.scripts]
shape6d-onboard = "shape6d.onboarding.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shape6d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
